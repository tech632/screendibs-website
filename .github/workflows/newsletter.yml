name: Weekly newsletter

# Fridays 08:00 UTC = 09:00 Paris (10:00 in summer time). Builds this week's
# issue from the posts doc and commits it; the deploy publishes it.
on:
  schedule:
    - cron: "0 8 * * 5"
  workflow_dispatch:
    inputs:
      doc_id:
        description: "Google Doc ID with this week's posts (blank = repo variable NEWSLETTER_DOC_ID)"
        required: false
      week:
        description: "Monday of the week, YYYY-MM-DD (blank = this week)"
        required: false

permissions:
  contents: write

jobs:
  issue:
    runs-on: ubuntu-latest
    env:
      DOC_ID: ${{ inputs.doc_id || vars.NEWSLETTER_DOC_ID }}
      WEEK: ${{ inputs.week }}
    steps:
      - name: Skip if no posts doc is configured
        if: env.DOC_ID == ''
        run: echo "NEWSLETTER_DOC_ID is not set; nothing to do." && exit 0

      - uses: actions/checkout@v4
        if: env.DOC_ID != ''

      - uses: actions/setup-node@v4
        if: env.DOC_ID != ''
        with:
          node-version: 22

      - name: Build the issue
        if: env.DOC_ID != ''
        id: build
        run: |
          set +e
          out=$(node scripts/newsletter.mjs --doc "$DOC_ID" ${WEEK:+--week "$WEEK"} 2>&1)
          code=$?
          echo "$out"
          if echo "$out" | grep -q "already exists"; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code

      - name: Commit and push
        if: env.DOC_ID != '' && steps.build.outputs.skip != 'true'
        run: |
          git config user.name "screendibs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/newsletter
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Newsletter: week of $(ls content/newsletter | sort | tail -1 | cut -c1-10)"
          git push
